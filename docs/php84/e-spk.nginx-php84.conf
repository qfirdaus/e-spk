server {
    listen 80;
    server_name spk-uat.upnm.edu.my;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name spk-uat.upnm.edu.my;

    root /var/www/e-spk-uat/public;
    index index.php index.html;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/upnm.key;

    access_log /var/log/nginx/spk-uat-access.log;
    error_log  /var/log/nginx/spk-uat-error.log;

    client_max_body_size 100M;

    # Custom request unavailable
    error_page 404 = /request-unavailable.php;

    location = /request-unavailable.php {
        internal;

        include snippets/fastcgi-php.conf;

        fastcgi_param SCRIPT_FILENAME $document_root/request-unavailable.php;

        fastcgi_pass unix:/run/php/e-spk-uat84.sock;
    }

    # Main routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handler
    location ~ \.php$ {

        include snippets/fastcgi-php.conf;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_pass unix:/run/php/e-spk-uat84.sock;

        fastcgi_intercept_errors on;
    }

    # Static cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 7d;
        access_log off;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block sensitive files
    location ~* \.(env|ini|log|conf)$ {
        deny all;
    }
}
